<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入金管理台帳</title>
<style>
  :root{
    --paper:#FBFAF7;
    --paper-2:#F3F1EB;
    --ink:#16181A;
    --ink-2:#5A5F63;
    --ink-3:#8A8F93;
    --rule:#D9D5CB;
    --rule-strong:#A9A399;
    --indigo:#1F3A5F;
    --indigo-2:#33547F;
    --overdue:#8C2F26;
    --overdue-bg:#F7ECE9;
    --today:#7A5B12;
    --today-bg:#F9F2DF;
    --paid:#2F5D4A;
    --stamp:#A8443A;
    --row-h:40px;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","YuGothic","Noto Sans JP","Meiryo",sans-serif;
    --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper-2);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    max-width:1180px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    border-left:1px solid var(--rule);
    border-right:1px solid var(--rule);
  }

  /* ── 帳簿の表紙罫 ───────────────────────── */
  .head{
    padding:18px 20px 0;
    border-top:3px solid var(--indigo);
  }
  .head-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .head-title{
    font-size:19px;font-weight:700;letter-spacing:.14em;margin:0;
  }
  .head-date{font-size:13px;color:var(--ink-2);letter-spacing:.04em;}
  .head-actions{margin-left:auto;display:flex;gap:8px;}

  .btn{
    font-family:inherit;font-size:13.5px;
    padding:7px 13px;
    background:var(--paper);
    color:var(--ink);
    border:1px solid var(--rule-strong);
    border-radius:2px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .btn:hover{background:#fff;border-color:var(--indigo);}
  .btn:disabled{color:var(--ink-3);border-color:var(--rule);cursor:default;background:var(--paper);}
  .btn-main{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .btn-main:hover{background:var(--indigo-2);border-color:var(--indigo-2);}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:2px;}

  /* ── 三つの数字 ──────────────────────── */
  .totals{
    display:flex;gap:34px;flex-wrap:wrap;
    margin:14px 0 0;padding:10px 0 14px;
    border-bottom:1px solid var(--rule);
  }
  .total-label{font-size:12px;color:var(--ink-2);letter-spacing:.08em;display:block;}
  .total-value{
    font-size:21px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.01em;
  }
  .total-value .yen{font-size:13px;font-weight:400;color:var(--ink-2);margin-left:2px;}
  .total-unpaid .total-value{color:var(--overdue);}

  /* ── 未照合の入金 ────────────────────── */
  .unmatched{border-bottom:1px solid var(--rule);}
  .unmatched-bar{
    width:100%;text-align:left;font-family:inherit;font-size:14px;
    background:var(--today-bg);border:0;border-left:4px solid var(--today);
    padding:9px 20px;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .unmatched-bar:hover{background:#F6EDD5;}
  .unmatched-bar .caret{font-size:11px;color:var(--today);}
  .unmatched-bar.is-empty{background:var(--paper);border-left-color:var(--rule);color:var(--ink-3);cursor:default;}
  .unmatched-list{padding:4px 20px 12px;display:none;}
  .unmatched-list.open{display:block;}
  .um{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:9px 0;border-bottom:1px dotted var(--rule);
  }
  .um-date{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;width:44px;}
  .um-amount{font-variant-numeric:tabular-nums;font-weight:600;width:92px;text-align:right;}
  .um-payer{font-family:var(--mono);font-size:13px;background:var(--paper-2);padding:2px 7px;border:1px solid var(--rule);}
  .um-arrow{color:var(--ink-3);}
  .um-guess{font-size:13.5px;}
  .um-guess .sub{color:var(--ink-2);font-size:12.5px;}
  .um-none{font-size:13.5px;color:var(--ink-2);}
  .um-act{margin-left:auto;display:flex;gap:6px;}

  /* ── 見出し(帳面の仕切り)───────────── */
  .tabs{display:flex;gap:0;padding:0 20px;border-bottom:1px solid var(--rule-strong);background:var(--paper);}
  .tab{
    font-family:inherit;font-size:14px;background:none;border:0;
    padding:11px 15px 9px;cursor:pointer;color:var(--ink-2);
    border-bottom:3px solid transparent;margin-bottom:-1px;letter-spacing:.03em;
  }
  .tab:hover{color:var(--ink);}
  .tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--indigo);}
  .tab .n{font-variant-numeric:tabular-nums;margin-left:5px;font-size:12.5px;color:var(--ink-2);}
  .tab.on .n{color:var(--indigo);}

  /* ── 台帳本体 ───────────────────────── */
  .ledger{padding:0 20px 120px;}
  .lrow-head,.lrow{
    display:grid;
    grid-template-columns:5px 58px minmax(150px,1.5fr) minmax(130px,1.2fr) 96px 52px 118px;
    align-items:center;
    column-gap:12px;
  }
  .lrow-head{
    font-size:12px;color:var(--ink-2);letter-spacing:.08em;
    padding:8px 0 7px;border-bottom:1px solid var(--rule-strong);
    position:sticky;top:0;z-index:5;background:var(--paper);
  }
  .lrow-head .num{text-align:right;}

  .lrow{
    position:relative;
    width:100%;min-height:var(--row-h);
    padding:0;margin:0;
    background:none;border:0;border-bottom:1px solid var(--rule);
    font-family:inherit;font-size:15px;color:var(--ink);
    text-align:left;cursor:pointer;
  }
  .lrow:hover{background:#FFFDF7;}
  .lrow > *{min-width:0;}
  .lrow .bar{align-self:stretch;background:transparent;}
  .lrow.s-overdue .bar{background:var(--overdue);}
  .lrow.s-today .bar{background:var(--today);}
  .lrow .due{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);}
  .lrow.s-overdue .due{color:var(--overdue);font-weight:600;}
  .lrow.s-today .due{color:var(--today);font-weight:600;}
  .lrow .nm{font-weight:600;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lrow .ct{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lrow .dt{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lrow .am{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;
    display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;}
  .am-diff{font-size:11px;font-weight:700;letter-spacing:.02em;}
  .d-short{color:var(--overdue);}
  .d-over{color:var(--paid);}
  .d-small{color:var(--ink-3);font-weight:400;}
  .lrow .mt{font-size:12.5px;color:var(--ink-2);}
  .lrow .rc{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lrow.s-overdue .rc{color:var(--overdue);}
  .lrow.s-hold .rc{color:var(--today);}
  .lrow.s-kaishu .bar{background:var(--ink-2);}
  .lrow.s-kaishu .rc{color:var(--overdue);font-weight:600;}
  .lrow.s-kaishu .nm,.lrow.s-kaishu .am{color:var(--ink-2);}

  /* 見消し線:消し込みは「消える」のではなく「線を引いて残す」 */
  .lrow .strike{
    position:absolute;left:0;right:0;top:50%;height:4px;
    transform:translateY(-50%) scaleX(0);transform-origin:left center;
    border-top:1px solid var(--indigo);border-bottom:1px solid var(--indigo);
    pointer-events:none;
  }
  .lrow.paid .strike{transform:translateY(-50%) scaleX(1);transition:transform .22s ease-out;}
  .lrow.paid{background:var(--paper);}
  .lrow.paid .nm,.lrow.paid .am{color:var(--ink-2);}
  .lrow.paid .ct,.lrow.paid .dt,.lrow.paid .due{color:var(--ink-3);}
  .lrow.paid .rc{color:var(--paid);font-weight:600;}
  .lrow.paid .bar{background:var(--paid);}
  @media (prefers-reduced-motion:reduce){
    .lrow.paid .strike{transition:none;}
  }

  /* ── 行内に開く入金欄 ───────────────── */
  .panel{display:none;border-bottom:1px solid var(--rule);background:#FFFDF6;padding:14px 0 16px 17px;}
  .panel.open{display:block;}
  .panel-grid{
    display:grid;
    grid-template-columns:206px 236px minmax(320px,1fr);
    gap:32px;align-items:start;max-width:1000px;
  }
  .panel-grid > .pay{grid-column:3;}
  @media (max-width:1060px){
    .panel-grid{grid-template-columns:206px 1fr;gap:24px;}
    .panel-grid > .pay{grid-column:1 / -1;}
  }
  @media (max-width:720px){
    .panel-grid{grid-template-columns:1fr;gap:16px;}
    .panel-grid > .pay{grid-column:1;}
  }
  .breakdown{font-size:13.5px;}
  .breakdown h4{margin:0 0 6px;font-size:12px;color:var(--ink-2);letter-spacing:.08em;font-weight:600;}
  .breakdown{min-width:0;}
  .breakdown table{border-collapse:collapse;width:100%;}
  .breakdown td.v{white-space:nowrap;}
  .breakdown td{padding:2px 0;}
  .breakdown td.k{padding-right:22px;color:var(--ink-2);white-space:nowrap;}
  .breakdown td.v{text-align:right;font-variant-numeric:tabular-nums;}
  .breakdown tr.sum td{border-top:1px solid var(--rule);padding-top:4px;font-weight:600;}
  .pay{display:flex;flex-direction:column;gap:10px;}
  .pay-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pay-label{font-size:12px;color:var(--ink-2);letter-spacing:.08em;width:66px;flex:0 0 66px;}
  .pay-row{min-height:34px;}
  .seg{display:flex;border:1px solid var(--rule-strong);border-radius:2px;overflow:hidden;}
  .pay-row .seg button{min-width:96px;}
  .seg button{
    font-family:inherit;font-size:13.5px;padding:6px 14px;background:var(--paper);
    border:0;border-right:1px solid var(--rule);cursor:pointer;color:var(--ink-2);
  }
  .seg button:last-child{border-right:0;}
  .seg button.on{background:var(--indigo);color:#fff;}
  .btn-pay{
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.02em;
    padding:11px 22px;background:var(--indigo);color:#fff;border:1px solid var(--indigo);
    border-radius:2px;cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .btn-pay:hover{background:var(--indigo-2);}
  .panel-sub{display:flex;gap:8px;}
  .btn-weak{color:var(--ink-2);border-color:var(--rule);background:transparent;}
  .btn-weak:hover{color:var(--ink);border-color:var(--rule-strong);}
  .pay-row.commit{margin-top:6px;}
  .pay-row.tight{min-height:0;margin-top:-4px;}
  .pay-row.alt{margin-top:10px;}
  .plan{margin-left:74px;}
  .alt-label{font-size:12px;color:var(--ink-3);letter-spacing:.06em;margin-right:2px;}
  .hint{font-size:12px;color:var(--ink-2);}
  .linky{font-family:inherit;font-size:12.5px;background:none;border:0;padding:6px 0 0;
    color:var(--indigo);cursor:pointer;}
  .linky:hover{text-decoration:underline;}
  .disclose{font-family:inherit;font-size:13px;background:none;border:0;padding:0;
    color:var(--ink-2);cursor:pointer;letter-spacing:.02em;}
  .disclose:hover{color:var(--ink);}
  .memo{font-size:13px;color:var(--ink-2);max-width:280px;}
  .memo-input{font-family:inherit;font-size:14px;padding:7px 10px;width:min(340px,72vw);
    border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);}
  .memo-input:focus{border-color:var(--indigo);}
  .plan{margin-top:4px;border-top:1px solid var(--rule);padding-top:10px;max-width:420px;}
  .plan-btns{margin-top:8px;}
  .plan-set{margin-top:8px;}
  .plan-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .plan-set{font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .pay .pay-input{font-size:20px;width:170px;padding:6px 10px;}
  .breakdown td.v.d-short{color:var(--overdue);font-weight:600;}
  .breakdown td.v.d-over{color:var(--paid);font-weight:600;}

  /* ── 元に戻す帯 ─────────────────────── */
  .undo{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--ink);color:#fff;
    padding:12px 20px;display:none;align-items:center;gap:16px;
    font-size:14px;
  }
  .undo.show{display:flex;}
  .undo .txt{font-variant-numeric:tabular-nums;}
  .undo .btn-undo{
    margin-left:auto;font-family:inherit;font-size:14px;font-weight:700;
    background:none;color:#fff;border:1px solid rgba(255,255,255,.55);
    padding:7px 16px;border-radius:2px;cursor:pointer;
  }
  .undo .btn-undo:hover{background:rgba(255,255,255,.12);}

  .empty{padding:44px 0;text-align:center;color:var(--ink-2);font-size:14px;}

  /* ── 本日の作業(ダッシュボード)──────── */
  [hidden]{display:none !important;}
  .dash{padding:16px 20px 120px;}
  .dash-cols{display:grid;grid-template-columns:1.6fr 1fr;gap:38px;align-items:start;}
  .sec-title{
    font-size:12px;letter-spacing:.1em;color:var(--ink-2);font-weight:600;
    border-bottom:1px solid var(--rule-strong);padding-bottom:6px;margin:0 0 2px;
  }
  .work{
    width:100%;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:16px;
    padding:15px 4px;border:0;border-bottom:1px solid var(--rule);background:none;
    font-family:inherit;text-align:left;cursor:pointer;color:var(--ink);
  }
  .work:hover{background:#FFFDF7;}
  .work .cnt{
    font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;
    text-align:right;line-height:1.1;letter-spacing:.01em;
  }
  .work .lbl{font-size:16px;font-weight:600;letter-spacing:.02em;}
  .work .sub{display:block;font-size:12.5px;font-weight:400;color:var(--ink-2);margin-top:3px;}
  .work .go{color:var(--ink-3);font-size:15px;}
  .work.w-overdue .cnt{color:var(--overdue);}
  .work.w-today .cnt{color:var(--today);}
  .work.w-done .cnt{font-size:17px;}
  .stamp{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;
    border:1.5px solid var(--stamp);color:var(--stamp);
    font-size:15px;font-weight:700;line-height:1;letter-spacing:0;
    transform:rotate(-9deg);opacity:.82;
  }
  .work.w-done .lbl{color:var(--ink-2);font-weight:400;}

  .total-kaishu{font-size:12.5px;color:var(--ink-2);margin:-4px 0 4px;}
  .total-bonus{font-size:12.5px;color:var(--ink-2);margin:0 0 16px;}
  .b-exp{color:var(--indigo);font-weight:600;}
  .dash-rule{font-size:11.5px;color:var(--ink-3);margin:12px 0 0;line-height:1.7;}
  .aging{margin-bottom:22px;}
  .age{padding:9px 0 8px;border-bottom:1px dotted var(--rule);}
  .age-top{display:flex;align-items:baseline;gap:10px;}
  .age-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .age-days{margin-left:auto;font-size:13px;font-weight:600;color:var(--overdue);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .age-note{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .age-bar{height:2px;background:var(--overdue);opacity:.45;margin-top:6px;}

  .cash{border:1px solid var(--rule-strong);background:#FFFDF6;padding:12px 14px;}
  .cash h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:600;}
  .cash-row{display:flex;gap:10px;font-size:13.5px;padding:3px 0;}
  .cash-row .amt{margin-left:auto;font-variant-numeric:tabular-nums;}
  .cash-row .rcpt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);}
  .cash-sum{border-top:1px solid var(--rule);margin-top:8px;padding-top:7px;display:flex;font-weight:600;font-size:14px;}
  .cash-sum .amt{margin-left:auto;font-variant-numeric:tabular-nums;}

  .back{
    font-family:inherit;font-size:13.5px;background:none;border:0;padding:0;
    color:var(--indigo);cursor:pointer;letter-spacing:.02em;
  }
  .back:hover{text-decoration:underline;}

  /* ── 画面の切り替え ─────────────────── */
  .viewnav{display:flex;gap:2px;margin-left:2px;}
  .vn{
    font-family:inherit;font-size:13.5px;background:none;border:0;
    padding:4px 11px;cursor:pointer;color:var(--ink-2);border-radius:2px;
  }
  .vn:hover{background:var(--paper-2);color:var(--ink);}
  .vn.on{background:var(--indigo);color:#fff;font-weight:600;}

  /* ── 入金表(契約者 × 月)─────────────── */
  .pend-g{margin:24px 0 0;}
  .pend-g:first-child{margin-top:16px;}
  .pend-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    border-bottom:1px solid var(--rule-strong);padding-bottom:6px;}
  .pend-h b{font-size:15.5px;letter-spacing:.03em;}
  .pend-h .cnt{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
  .pend-h .sum{margin-left:auto;font-size:13.5px;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .pend-w{font-size:12px;color:var(--ink-3);margin:6px 0 0;line-height:1.7;}
  .pend-r{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(90px,1fr) 1.1fr 110px;
    gap:14px;align-items:center;width:100%;min-height:42px;padding:0;background:none;border:0;
    border-bottom:1px solid var(--rule);font-family:inherit;font-size:14.5px;color:var(--ink);
    text-align:left;cursor:pointer;}
  .pend-r:hover{background:#FFFDF7;}
  .pend-r[disabled]{cursor:default;}
  .pend-r > *{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pend-r .nm{font-weight:600;}
  .pend-r .sub{font-size:13px;color:var(--ink-2);}
  .pend-r .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .pend-r.on{background:#FFFDF6;}
  .pend-p{background:#FFFDF6;border-bottom:1px solid var(--rule);padding:14px 0 16px 16px;}
  .pend-q{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:.02em;}
  .pend-note{margin:0 0 12px;font-size:12.5px;color:var(--ink-2);line-height:1.7;max-width:560px;}
  .pend-undecided{color:var(--overdue);}
  .pend-none{padding:64px 0;text-align:center;color:var(--ink-2);font-size:14px;}
  @media (max-width:820px){ .pend-r{grid-template-columns:1fr auto;gap:4px 12px;} }
  .mtx-head{display:flex;align-items:center;gap:16px;padding:14px 20px 10px;flex-wrap:wrap;}
  .mtx-sum{font-size:13.5px;color:var(--ink-2);}
  .mtx-sum b{color:var(--overdue);font-variant-numeric:tabular-nums;font-size:15px;}
  .mtx-sort{margin-left:auto;display:flex;gap:2px;}
  .mtx-wrap{overflow:auto;max-height:calc(100vh - 230px);padding:0 20px 40px;}
  .mtx{border-collapse:separate;border-spacing:0;font-size:13px;}
  .mtx th,.mtx td{padding:0;text-align:center;}
  .mtx thead th{
    position:sticky;top:0;z-index:2;background:var(--paper);
    font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.03em;
    padding:8px 0 6px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;
  }
  .mtx .nmcol{
    position:sticky;left:0;z-index:3;background:var(--paper);
    text-align:left;padding-right:14px;min-width:186px;border-right:1px solid var(--rule);
  }
  .mtx thead .nmcol{z-index:4;}
  .mtx tbody td{border-bottom:1px solid var(--rule);height:34px;}
  .mtx tbody tr:hover td,.mtx tbody tr:hover .nmcol{background:#FFFDF7;}
  .mtx tbody tr{cursor:pointer;}
  .mrow-name{font-weight:600;font-size:14px;display:block;}
  .mrow-sub{font-size:11.5px;color:var(--ink-3);}
  .kaishu-tag{color:var(--overdue);}
  .cell{
    display:inline-block;width:30px;height:23px;line-height:23px;
    font-size:11px;border-radius:1px;overflow:hidden;white-space:nowrap;
  }
  .c-paid{background:#EDF2EF;color:#7E9A8D;}
  .c-late{background:var(--today-bg);color:var(--today);font-weight:700;}
  .c-unpaid{background:var(--overdue-bg);color:var(--overdue);font-weight:700;}
  .c-due{background:var(--today-bg);color:var(--today);font-weight:700;}
  .c-part{background:#EAF0F6;color:var(--indigo);font-weight:700;}
  .c-pending{border:1px dotted var(--rule-strong);width:28px;height:21px;}
  .c-none{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--paper-2) 3px,var(--paper-2) 4px);}
  .mtx .col-n{
    font-variant-numeric:tabular-nums;padding-left:16px;text-align:right;white-space:nowrap;
  }
  .mtx .n-late{color:var(--overdue);font-weight:700;}
  .rec-late{color:var(--today);font-weight:700;margin-left:4px;}
  .rec-unpaid{color:var(--overdue);font-weight:700;margin-left:4px;}
  .rec-part{color:var(--indigo);font-weight:700;margin-left:4px;}
  .rec-ok{color:var(--ink-3);}
  .test-tag{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:2px;
    font-size:10.5px;font-weight:700;letter-spacing:.06em;vertical-align:2px;
    color:var(--stamp);border:1px solid var(--stamp);background:#FBF0EE;}
  .bonus-tag{color:var(--indigo);font-weight:700;}
  .rec-line{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;padding-bottom:8px;
    margin-bottom:6px;border-bottom:1px dotted var(--rule);}
  .rec-line b{font-variant-numeric:tabular-nums;}
  .mtx-detail td{background:#FFFDF6;text-align:left;padding:10px 0 12px;}
  .mtx-detail .in{padding-left:2px;font-size:13px;}
  .mtx-detail .line{display:flex;gap:14px;padding:2px 0;}
  .mtx-detail .line .amt{font-variant-numeric:tabular-nums;}
  .mtx-legend{display:flex;gap:16px;padding:14px 20px 0;font-size:12px;color:var(--ink-2);flex-wrap:wrap;}
  .mtx-legend span{display:flex;align-items:center;gap:6px;}

  /* ── 銀行明細の照合 ─────────────────── */
  .modal{
    position:fixed;inset:0;z-index:30;background:rgba(22,24,26,.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:36px 16px;overflow:auto;
  }
  .modal-box{
    background:var(--paper);border-top:3px solid var(--indigo);
    width:100%;max-width:540px;padding:20px 24px 22px;
    box-shadow:0 12px 40px rgba(0,0,0,.22);
  }
  .modal-box h3{margin:0 0 14px;font-size:17px;letter-spacing:.06em;}
  .imp-line{display:flex;padding:6px 0;border-bottom:1px dotted var(--rule);font-size:14px;}
  .imp-line span{color:var(--ink-2);}
  .imp-line b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;}
  .imp-ng{margin:14px 0 4px;border:1px solid var(--overdue);background:var(--overdue-bg);padding:11px 13px;}
  .imp-ng h4{margin:0 0 6px;font-size:13px;color:var(--overdue);letter-spacing:.04em;}
  .imp-ng div{font-size:13.5px;padding:2px 0;display:flex;gap:10px;}
  .imp-ng div span{margin-left:auto;color:var(--ink-2);font-size:12.5px;}
  .imp-ask{margin:18px 0 6px;font-size:15px;font-weight:600;}
  .imp-input-row{display:flex;align-items:center;gap:8px;}
  .imp-input{
    font-family:inherit;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;
    text-align:right;width:230px;padding:8px 12px;
    border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);
  }
  .imp-input:focus{border-color:var(--indigo);outline:2px solid var(--indigo);outline-offset:1px;}
  .imp-note{font-size:12.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.6;}
  .imp-actions{display:flex;gap:10px;align-items:center;margin-top:20px;}
  .imp-verdict{margin:16px 0 0;padding:13px 14px;font-size:15px;font-weight:600;}
  .imp-ok{border:1px solid var(--paid);background:#EDF3F0;color:var(--paid);}
  .imp-bad{border:1px solid var(--overdue);background:var(--overdue-bg);color:var(--overdue);}
  .imp-cause{margin:10px 0 0;font-size:13px;color:var(--ink-2);line-height:1.75;}
  .imp-cause li{margin-left:1.1em;}
  .hist-sub{font-size:13px;color:var(--ink-2);margin:0 0 14px;}
  .tree-g{margin-bottom:15px;}
  .tree-g h5{margin:0 0 5px;font-size:11.5px;letter-spacing:.08em;color:var(--ink-2);
    border-bottom:1px solid var(--rule-strong);padding-bottom:4px;font-weight:600;}
  .tree-i{display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:baseline;
    padding:4px 0 4px 12px;border-left:2px solid var(--rule);font-size:13.5px;}
  .tree-i .when{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums;}
  .tree-i .who{color:var(--ink-3);font-size:11.5px;white-space:nowrap;}
  .tree-memo{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;}
  .kind{display:inline-block;min-width:34px;text-align:center;font-size:11px;font-weight:700;
    padding:1px 5px;border-radius:2px;margin-right:6px;}
  .k-plain{background:var(--paper-2);color:var(--ink-2);}
  .k-ok{background:#EDF3F0;color:var(--paid);}
  .k-warn{background:var(--today-bg);color:var(--today);}
  .k-bad{background:var(--overdue-bg);color:var(--overdue);}
  .k-info{background:#EAF0F6;color:var(--indigo);}
  .imp-mock{margin-top:18px;padding-top:10px;border-top:1px dotted var(--rule);font-size:11.5px;color:var(--ink-3);}

  @media (max-width:820px){
    .lrow-head,.lrow{
      grid-template-columns:5px 48px minmax(84px,1fr) 84px 60px;
      column-gap:8px;
    }
    .lrow-head .col-ct,.lrow-head .col-dt,.lrow-head .col-mt,
    .lrow .ct,.lrow .dt,.lrow .mt{display:none;}
    .lrow .nm{font-size:14.5px;}
    .lrow .rc{font-size:11.5px;}
    .ledger{padding-left:14px;padding-right:14px;}
    .head{padding-left:14px;padding-right:14px;}
    .tabs{padding-left:14px;padding-right:14px;}
    .dash{padding-left:14px;padding-right:14px;}
    .dash-cols{grid-template-columns:1fr;gap:26px;}
    .totals{gap:20px;}
    .total-value{font-size:18px;}
  }

  @media print{
    body{background:#fff;}
    .sheet{border:0;max-width:none;}
    .head-actions,.back,.viewnav,.tabs,.unmatched,.undo,.panel,#viewDash,#cardPane{display:none !important;}
    #viewCard,#listPane{display:block !important;}
    .lrow{cursor:default;}
    .lrow.paid{display:none;}
  }

  /* ── 連絡(督促) ─────────────────────── */
  .contact{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);max-width:520px;}
  .contact h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:600;}
  .contact-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .contact-k{font-size:12px;color:var(--ink-2);letter-spacing:.08em;width:66px;flex:0 0 66px;}
  .contact-tel{font-size:17px;font-weight:600;color:var(--indigo);text-decoration:none;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .contact-tel:hover{text-decoration:underline;}
  .contact-dummy{font-size:11.5px;color:var(--ink-3);}
  .contact-note{font-size:12px;color:var(--ink-2);line-height:1.7;margin-top:2px;}
  .undec{color:var(--overdue);font-weight:700;}
  .cmp-line{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted var(--rule);}
  .cmp-k{font-size:12px;color:var(--ink-2);letter-spacing:.06em;width:48px;flex:0 0 48px;}
  .cmp-v{font-size:14px;}
  .cmp-input{flex:1;font-family:inherit;font-size:15px;padding:7px 9px;
    border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);}
  .cmp-lbl{display:block;margin:12px 0 4px;font-size:12px;color:var(--ink-2);letter-spacing:.06em;}
  .cmp-text{width:100%;font-family:inherit;font-size:14px;line-height:1.7;padding:10px;
    border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);resize:vertical;}
  .cmp-input:focus,.cmp-text:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}

  /* ── 新しいお客さんの追加 ───────────────── */
  .nc-num{max-width:160px;} .nc-day{max-width:70px;}
  .nc-unit{font-size:12.5px;color:var(--ink-2);}
  .nc-preview{margin:12px 0 4px;padding:10px 12px;background:#FFFDF6;border:1px solid var(--rule);
    font-size:13.5px;line-height:1.7;}
  .nc-line{font-variant-numeric:tabular-nums;}
  .nc-line b{font-weight:700;}
  .nc-hint{color:var(--ink-3);}
  .nc-ok{margin-top:6px;color:var(--paid);font-weight:600;}
  .nc-warn{margin-top:6px;color:var(--overdue);font-weight:600;}

  /* ── お客さんカード(1画面で全部)───────────── */
  .card-wrap{padding:0 20px 120px;}
  .find{display:flex;align-items:center;gap:10px;padding:14px 0 12px;flex-wrap:wrap;}
  .find input{font-family:inherit;font-size:16px;padding:9px 12px;width:min(320px,70vw);
    border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);}
  .find input:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
  .find-lbl{font-size:12px;color:var(--ink-2);letter-spacing:.08em;}
  .find-hits{border-top:1px solid var(--rule-strong);}
  .hit{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;background:none;
    border:0;border-bottom:1px solid var(--rule);font-family:inherit;font-size:15px;
    color:var(--ink);text-align:left;cursor:pointer;}
  .hit:hover{background:#FFFDF7;}
  .hit .nm{font-weight:600;}
  .hit .ct{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hit .st{margin-left:auto;font-size:12.5px;white-space:nowrap;}

  .cardv{padding-bottom:8px;}
  .card-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
    padding:14px 0 12px;border-bottom:2px solid var(--indigo);}
  .card-name{font-size:26px;font-weight:700;letter-spacing:.04em;line-height:1.2;}
  .card-ct{font-size:13.5px;color:var(--ink-2);margin-top:3px;}
  .card-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .card-tel{font-size:17px;font-weight:700;color:#fff;background:var(--indigo);
    border:1px solid var(--indigo);border-radius:2px;padding:9px 16px;text-decoration:none;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .card-tel:hover{background:var(--indigo-2);}

  /* いま何を言えばよいか：最上段に1行で */
  .say{margin:14px 0 0;padding:14px 16px;border-left:5px solid var(--indigo);background:#F1F4F8;}
  .say.s-overdue{border-left-color:var(--overdue);background:var(--overdue-bg);}
  .say.s-today{border-left-color:var(--today);background:var(--today-bg);}
  .say.s-ok{border-left-color:var(--paid);background:#EDF3F0;}
  .say-main{font-size:19px;font-weight:700;line-height:1.45;}
  .say-sub{font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.7;}

  /* 左=お金・ようす・メモ / 右=支払いの記録(全48回) */
  .card-cols{display:grid;grid-template-columns:minmax(280px,1fr) minmax(400px,1.25fr);
    gap:30px;margin-top:20px;align-items:start;}
  .card-left{display:flex;flex-direction:column;gap:22px;min-width:0;}
  .card-right{min-width:0;}
  .card-right .terms{max-height:calc(100vh - 300px);overflow-y:auto;}
  @media (max-width:900px){
    .card-cols{grid-template-columns:1fr;gap:22px;}
    .card-right .terms{max-height:none;}
  }
  .card-sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-2);font-weight:600;
    border-bottom:1px solid var(--rule-strong);padding-bottom:6px;}
  .kv{width:100%;border-collapse:collapse;font-size:14.5px;}
  .kv td{padding:6px 0;border-bottom:1px dotted var(--rule);}
  .kv td.k{color:var(--ink-2);font-size:13.5px;white-space:nowrap;padding-right:14px;}
  .kv td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  .kv tr.big td{font-size:17px;padding:9px 0;}

  .mini{display:flex;gap:3px;flex-wrap:wrap;margin:4px 0 8px;}
  .mini-c{width:34px;text-align:center;font-size:10.5px;color:var(--ink-3);}
  .mini-c i{display:block;height:24px;line-height:24px;font-size:11.5px;border-radius:1px;font-style:normal;}
  .card-rec{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13.5px;margin-top:4px;}
  .card-rec b{font-variant-numeric:tabular-nums;}

  .log{margin-top:6px;max-height:340px;overflow:auto;}
  .log-i{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:baseline;
    padding:6px 0;border-bottom:1px dotted var(--rule);font-size:13.5px;}
  .log-i .when{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums;}
  .log-i .who{color:var(--ink-3);font-size:11.5px;white-space:nowrap;}
  .log-memo{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;}
  .card-do{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule-strong);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  /* ── 支払いの記録(全42回・ツリー)と メモ ───────────── */
  .memo-box{margin-top:18px;}
  .memo-box textarea{width:100%;font-family:inherit;font-size:14px;line-height:1.7;padding:10px;
    border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);resize:vertical;}
  .memo-box textarea:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
  .memo-save{margin-top:8px;display:flex;gap:8px;align-items:center;}
  .memo-saved{font-size:12px;color:var(--paid);font-weight:600;}

  .terms{margin-top:8px;border-top:1px solid var(--rule-strong);}
  .term-r{display:grid;grid-template-columns:46px 78px 92px 60px 1fr 20px;gap:10px;align-items:center;
    width:100%;padding:8px 4px;background:none;border:0;border-bottom:1px solid var(--rule);
    font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;cursor:pointer;}
  .term-r:hover{background:#FFFDF7;}
  .term-r.on{background:#FFFDF6;}
  .term-r .no{font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .term-r .dt{font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .term-r .am{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;}
  .term-r .sub{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .term-r .cv{color:var(--ink-3);font-size:11px;}
  .st-tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:2px;text-align:center;white-space:nowrap;}
  .t-paid{background:#EDF3F0;color:var(--paid);} .t-late{background:var(--today-bg);color:var(--today);}
  .t-unpaid{background:var(--overdue-bg);color:var(--overdue);} .t-part{background:#EAF0F6;color:var(--indigo);}
  .t-due{background:var(--today-bg);color:var(--today);} .t-pending{background:var(--paper-2);color:var(--ink-3);}
  .term-p{padding:10px 0 14px 46px;border-bottom:1px solid var(--rule);background:#FFFDF6;}
  .term-e{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:baseline;
    padding:4px 0 4px 10px;border-left:2px solid var(--rule);font-size:13px;}
  .term-e .when{color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums;}
  .term-e .who{color:var(--ink-3);font-size:11px;white-space:nowrap;}
  .term-add{display:flex;gap:8px;margin-top:10px;padding-left:10px;flex-wrap:wrap;}
  .term-add input{flex:1;min-width:200px;font-family:inherit;font-size:14px;padding:8px 10px;
    border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);}
  .term-add input:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
  .clist{border-top:1px solid var(--rule-strong);}
  @media (max-width:720px){
    .term-r{grid-template-columns:40px 66px 82px 54px 20px;}
    .term-r .sub{display:none;}
  }

  .yomi-note{font-size:12px;color:var(--today);background:var(--today-bg);
    border-left:3px solid var(--today);padding:7px 11px;margin:8px 0 0;line-height:1.6;}
  .nmlink{cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule-strong);
    text-underline-offset:3px;}
  .nmlink:hover{text-decoration-color:var(--indigo);color:var(--indigo);}
</style>
</head>
<body>
<div class="sheet">

  <div class="head">
    <div class="head-top">
      <h1 class="head-title">入金管理台帳</h1>
      <span class="head-date" id="headDate"></span>
      <nav class="viewnav">
        <button class="vn on" data-view="dash">本日の作業</button>
        <button class="vn" data-view="card">お客さん</button>
        <button class="vn" data-view="pend">懸案</button>
      </nav>
      <span class="head-actions">
        <button class="btn" id="btnNew">新しいお客さんを追加</button>
        <button class="btn" id="btnImport">銀行明細を取り込む</button>
        <button class="btn" onclick="window.print()">遅れの一覧を印刷</button>
        <button class="btn" id="btnUndoTop" disabled>元に戻す</button>
      </span>
    </div>
  </div>

  <section id="viewDash">
    <div class="dash">
      <div class="totals">
        <div><span class="total-label">今月の予定</span><span class="total-value" id="dPlan">0<span class="yen">円</span></span></div>
        <div><span class="total-label">入金済み</span><span class="total-value" id="dPaid">0<span class="yen">円</span></span></div>
        <div class="total-unpaid"><span class="total-label">未収</span><span class="total-value" id="dRest">0<span class="yen">円</span></span></div>
      </div>
      <p class="total-kaishu"></p>
      <p class="total-bonus"></p>
      <div class="dash-cols">
        <div>
          <h2 class="sec-title">本日の作業</h2>
          <div id="workList"></div>
        <p class="dash-rule" id="dashRule"></p>
        </div>
        <div>
          <h2 class="sec-title">溜まっているもの</h2>
          <div class="aging" id="agingList"></div>
          <div class="cash" id="cashBox"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="viewCard" hidden>
    <div id="listPane">
      <div class="totals">
        <div><span class="total-label">今月の予定</span><span class="total-value" id="tPlan">0<span class="yen">円</span></span></div>
        <div><span class="total-label">入金済み</span><span class="total-value" id="tPaid">0<span class="yen">円</span></span></div>
        <div class="total-unpaid"><span class="total-label">未収</span><span class="total-value" id="tRest">0<span class="yen">円</span></span></div>
      </div>
      <p class="mtx-sum" id="mtxSum" style="padding:0 20px 12px"></p>

      <div class="unmatched">
        <button class="unmatched-bar" id="umBar">
          <span class="caret" id="umCaret">&#9654;</span>
          <span id="umText">誰の入金か分からないもの 3件</span>
        </button>
        <div class="unmatched-list" id="umList"></div>
      </div>

      <nav class="tabs" id="tabs"></nav>

      <div class="ledger">
        <div class="lrow-head">
          <span></span>
          <span>期日</span>
          <span>お名前</span>
          <span class="col-ct">契約</span>
          <span class="num">請求額</span>
          <span class="col-mt">回次</span>
          <span>記録</span>
        </div>
        <p class="yomi-note" id="yomiNote"></p>
        <div id="rows"></div>
      </div>
    </div>

    <div class="card-wrap" id="cardPane" hidden>
      <button class="back" id="backList">&#8592; お客さんの一覧へ戻る</button>
      <div id="cardBody"></div>
    </div>
  </section>

  <section id="viewPend" hidden>
    <div class="ledger" id="pendList"></div>
  </section>

</div>

<div class="modal" id="histModal" hidden>
  <div class="modal-box">
    <h3><span id="histName"></span><button class="btn" data-histclose="1" style="float:right">閉じる</button></h3>
    <div id="histBody"></div>
  </div>
</div>

<div class="modal" id="importModal" hidden>
  <div class="modal-box">
    <h3>銀行明細の取り込み</h3>
    <div id="importBody"></div>

// 出来事は追記のみ。訂正は「取り消した」という出来事を足す
const EVENTS = [];
let clock = 9 * 60;
function stamp(){ const m = clock += 3;
  return `${TODAY.replace('-','/')} ${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function logEvent(r, kind, text, memo){
  EVENTS.push({cid:r.id, no:r.no, when:stamp(), who:'管理者', kind, text, memo:memo || ''});
}
function pastEvents(r){
  const out = [], hh = HIST[r.id] || [];
  hh.forEach((c, mi) => {
    if(c === 'none' || c === 'pending' || c === 'live') return;
    const no = mi - r.si + 1, mo = MONTHS[mi], when = `${mo.y}/${String(mo.m).padStart(2,'0')}`;
    out.push({cid:r.id, no, when, who:'—', kind:'請求', text:`${no}回目の請求`, memo:''});
    if(c === 'paid')   out.push({cid:r.id, no, when, who:'管理者', kind:'入金', text:'期日までに入金', memo:''});
    if(c === 'late')   out.push({cid:r.id, no, when, who:'管理者', kind:'遅れ', text:'期日より後に入金', memo:''});
    if(c === 'part')   out.push({cid:r.id, no, when, who:'管理者', kind:'差額', text:'請求と違う金額で入金', memo:''});
    if(c === 'unpaid') out.push({cid:r.id, no, when, who:'—', kind:'未収', text:'入金の確認が取れないまま', memo:''});
  });
  PROMISES.filter(pr => pr.id === r.id).forEach(pr => {
    out.push({cid:r.id, no:r.no, when:`2026/${pr.heard.replace('-','/')}`, who:'管理者', kind:'約束',
              text:`${pr.day.replace('-','/')}に支払うと約束`, memo:pr.memo});
    if(pr.day < TODAY) out.push({cid:r.id, no:r.no, when:`2026/${pr.day.replace('-','/')}`, who:'—',
              kind:'不履行', text:'約束の日を過ぎても入金なし', memo:''});
  });
  if(r.kaishu) out.push({cid:r.id, no:r.no, when:'2026/06', who:'管理者', kind:'回収',
              text:'車両を回収', memo:'残債の扱いは未確定'});
  return out;
}
const KIND_CLASS = {'請求':'k-plain','入金':'k-ok','遅れ':'k-warn','差額':'k-info','未収':'k-bad',
                    '約束':'k-warn','不履行':'k-bad','回収':'k-bad','メモ':'k-info','保留':'k-warn','取消':'k-plain'};

let histId = null;
function openHist(id){ histId = id; document.getElementById('histModal').hidden = false; renderHist(); }
function closeHist(){ histId = null; document.getElementById('histModal').hidden = true; }
function renderHist(){
  const r = state.find(x => x.id === histId);
  const all = pastEvents(r).concat(EVENTS.filter(e => e.cid === r.id));
  const groups = {};
  all.forEach(e => { (groups[e.no] = groups[e.no] || []).push(e); });
  const keys = Object.keys(groups).map(Number).sort((a,b) => b - a);
  document.getElementById('histName').textContent = `${r.name} さんの記録`;
  document.getElementById('histBody').innerHTML =
    `<p class="hist-sub">${r.ct}　${r.no}回目 / 48回　${r.diff ? (r.diff<0?'不足 ':'余り ') + yen(Math.abs(r.diff)) + '円' : '過不足なし'}</p>
     <div class="tree">${keys.map(k => `
       <div class="tree-g"><h5>${k}回目</h5>
         ${groups[k].map(e => `<div class="tree-i">
            <span class="when">${e.when}</span>
            <span><span class="kind ${KIND_CLASS[e.kind]||'k-plain'}">${e.kind}</span>${e.text}
              ${e.memo ? `<span class="tree-memo">${e.memo}</span>` : ''}</span>
            <span class="who">${e.who}</span>
          </div>`).join('')}
       </div>`).join('')}</div>
     <p class="imp-mock">記録は足すだけで、書き換えられません。訂正は「取り消した」という記録が増えます。</p>`;
}

function panelHtml(r){
  const rows = r.parts.map(p => `<tr><td class="k">${p[0]}</td><td class="v">${yen(p[1])}</td></tr>`).join('');
  const c = record(r), need = r.amount - r.diff;

    `<button class="${m===r.method?'on':''}" data-m="${m}" data-id="${r.id}">${m}</button>`).join('');
  const money = [['plan', `${yen(r.amount)}円`]]
    .concat(r.diff ? [['need', `${yen(need)}円`]] : [])
    .concat([['other','ちがう金額']])
    .map(([k,l]) => `<button class="${payChoice===k?'on':''}" data-choice="${k}">${l}</button>`).join('');
  const hintText = payChoice==='need' ? '過不足をふくめた金額です'
                 : payChoice==='plan' && r.diff ? '過不足はそのまま繰り越します' : '';

      </span></div>`;

  const label = payChoice==='other' ? '入れた金額で記録する'

  const diffBox = !r.diff ? '' : `

      ${!planOpen ? '' : (r.plan
        ? `<div class="plan-set">${PLAN[r.plan]}${r.plan==='split'
             ? `（1回あたり ${yen(Math.ceil(Math.abs(r.diff)/Math.max(r.rest,1)))}円 を${r.diff<0?'上乗せ':'差し引き'}）` : ''}
           <button class="btn btn-weak" data-planclear="${r.id}">決め直す</button></div>`

           </div>`)}

  return `<div class="panel open" data-panel="${r.id}">
    <div class="panel-grid">
      <div class="breakdown">
        <h4>何の分か</h4>

    </div>
  </div>`;

function pendPanel(k, row, i){
  const r = row.id ? state.find(x => x.id === row.id) : null;
  const memo = `<div class="prow"><span class="plabel">メモ</span>
      <input class="memo-input" autocomplete="off" placeholder="必要なら書いてください（任意）"></div>`;
  const hist = r ? `<button class="linky" data-hist="${r.id}">この契約の記録を見る →</button>` : '';

  if(k === 'cash'){
    const c = CASH[i];
    return `<div class="pend-p"><p class="pend-q">銀行に入れましたか</p>
      <p class="pend-note">${c.date.replace('-','/')}に受け取り、領収書は ${c.receipt}。金額は ${yen(c.amount)}円 です。</p>
      ${memo}
      <div class="prow commit"><span class="plabel"></span>
        <button class="btn-pay" data-cashdone="${i}">銀行へ入れた</button></div></div>`;
  }

  if(k === 'diff' || k === 'settle'){
    const rest = Math.max(r.rest, 1);
    return `<div class="pend-p">
      <p class="pend-q">${r.diff<0?'不足':'余り'}の ${yen(Math.abs(r.diff))}円 を、どう処理しますか</p>
      <p class="pend-note">${k === 'settle'
        ? `残り${r.rest}回です。ここで決めておかないと、最終回に一括で請求することになります。`
        : '決めるまで毎回この一覧に出ます。'}</p>
      ${memo}
      ${r.plan
        ? `<div class="plan-set">${PLAN[r.plan]}${r.plan==='split'
             ? `（1回あたり ${yen(Math.ceil(Math.abs(r.diff)/rest))}円 を${r.diff<0?'上乗せ':'差し引き'}）` : ''}

        : `<div class="plan-btns">
             <button class="btn" data-plan="last" data-pid="${r.id}">最終回にまとめて</button>
             <button class="btn" data-plan="split" data-pid="${r.id}">残り${rest}回で均等に（1回 ${yen(Math.ceil(Math.abs(r.diff)/rest))}円）</button>
             <button class="btn" data-plan="separate" data-pid="${r.id}">別途いっかつで請求</button>
           </div>`}
      ${hist}</div>`;
  }

    ? {q:'この残債を、どう扱いますか', n:'売却代金をどう充てるか、残りを請求するかが決まっていません。決まり次第、ここに選択肢を出します。'}
    : {q:'この契約を、どうしますか', n:'本人に確認するのか、条件を見直すのかが決まっていません。決まり次第、ここに選択肢を出します。'};

    <p class="pend-note pend-undecided">${q.n}</p>
    ${memo}
    <div class="prow commit"><span class="plabel"></span>
      <button class="btn" data-pmemo="${r.id}">記録だけ残す</button></div>

function renderPend(){
  const g = [];

  if(cash.length) g.push({k:'cash', t:'預かった現金を銀行へ入れる', sum:cashSum,
    w:'受け取ってから日が空くほど、通帳と合わなくなります。',
    rows:cash.map(c => ({id:null, a:c.name, b:`領収書 ${c.receipt}`,
      c:`${c.date.replace('-','/')} 受領`, n:c.amount}))});

  const dd = state.filter(r => bigDiff(r) && !r.kaishu);
  if(dd.length) g.push({k:'diff', t:'差額の扱いを決める', sum:dd.reduce((s,r) => s + Math.abs(r.diff), 0),
    w:`${yen(THRESHOLD)}円 以上ずれている契約です。決めるまで毎回くり返します。`,
    rows:dd.map(r => ({id:r.id, a:r.name, b:r.ct,
      c:r.plan ? `${PLAN[r.plan]} と決めています` : '扱いが未定です', n:r.diff}))});

  const kk = state.filter(r => r.kaishu);
  if(kk.length) g.push({k:'kaishu', t:'回収した車の残債を片づける', sum:kk.reduce((s,r) => s + r.debt, 0),
    w:'売却代金の充当と、残りをどうするかが決まっていません。',
    rows:kk.map(r => ({id:r.id, a:r.name, b:r.ct, c:`${r.no}回目で回収`, n:r.debt}))});

  const hb = state.filter(heavyBonus).slice().sort((a,b) => b.bonus/b.amount - a.bonus/a.amount);
  if(hb.length) g.push({k:'bonus', t:'ボーナス頼みが重い契約を見直す', sum:hb.reduce((s,r) => s + r.bonus, 0),
    w:`毎月額の${BONUS_RATIO}回分を超えています。督促の対象ではありませんが、放っておくと最後に残ります。`,
    rows:hb.map(r => ({id:r.id, a:r.name, b:r.ct,
      c:`毎月額の ${(r.bonus/r.amount).toFixed(1)}回分`, n:r.bonus}))});

  const ns = state.filter(needSettle);
  if(ns.length) g.push({k:'settle', t:'完済前の精算を案内する', sum:ns.reduce((s,r) => s + Math.abs(r.diff), 0),
    w:`残り${NOTICE_REMAIN}回を切って差額が残っています。`,
    rows:ns.map(r => ({id:r.id, a:r.name, b:r.ct, c:`残り${r.rest}回`, n:r.diff, test:r.test}))});

  document.getElementById('pendList').innerHTML = g.length ? g.map(x => `
    <div class="pend-g">
      <div class="pend-h"><b>${x.t}</b><span class="cnt">${x.rows.length}件</span>
        <span class="sum">${yen(x.sum)}円</span></div>
      <p class="pend-w">${x.w}</p>
      ${x.rows.map((r, i) => {
        const key = `${x.k}:${i}`;
        return `<button class="pend-r${pendOpen === key ? ' on' : ''}" data-pendopen="${key}">
          <span class="nm">${r.a}${r.test ? testTag(r) : ''}</span><span class="sub">${r.b}</span>
          <span class="sub">${r.c}</span>
          <span class="n ${r.n < 0 ? 'd-short' : ''}">${yen(Math.abs(r.n))}</span>
        </button>` + (pendOpen === key ? pendPanel(x.k, r, i) : '');
      }).join('')}
    </div>`).join('') : '<p class="pend-none">片づいていない仕事はありません。</p>';
}

function renderSummary(){
  const rows = state.map(r => { const o = owedOf(r); return {late:o.n, owed:o.yen}; });
  const owedAll = rows.reduce((a, x) => a + x.owed, 0);
  const people = rows.filter(x => x.late).length;
  const worst = Math.max(0, ...rows.map(x => x.late));
  const el = document.getElementById('mtxSum');
  if(el) el.innerHTML = `未収の合計 <b>${yen(owedAll)}円</b> ／ 滞りのある方 <b>${people}</b>名 ／ いちばん長い方で <b>${worst}</b>ヶ月`;
}
// ─── お客さんカード:電話を受けながら1画面で答えられるようにする ─────────
// あいうえお順:漢字だけでは正しい五十音順にならないため、契約ごとに「よみ(カナ)」を持つ。
// よみが入っている人はよみで、まだの人は漢字で並べる(入れるほど正確になる)。
const KANA_SEED = {};
SEED.forEach(s => { if(s.target) KANA_SEED[s.target] = s.payer; });   // 振込依頼人名(実カナ)から拾える分
const yomiOf = r => normKana(r.kana || KANA_SEED[r.id] || '');
const hasYomi = r => !!yomiOf(r);
const jaOrder = new Intl.Collator('ja');
const sortKey = r => yomiOf(r) || r.name;
const byKana = (a, b) => jaOrder.compare(sortKey(a), sortKey(b)) || (a.id - b.id);

let cardId = null;

// この人の未収(12ヶ月のうち「未」の回数×毎月額)
function owedOf(r){
  const cells = MONTHS.map((_, mi) => cellState(r, mi));
  return {n: cells.filter(c => c === 'unpaid').length,
          yen: cells.filter(c => c === 'unpaid').length * r.amount, cells};
}
// 「06月27日」ではなく「6月27日」と読めるように
const jpDate = md => `${+md.slice(0,2)}月${+md.slice(3,5)}日`;
// いちばん上に出す「いま伝えること」
function sayOf(r){
  const st = statusOf(r), o = owedOf(r), pr = PROMISES.find(p => p.id === r.id);
  const money = `${yen(r.amount)}円`;
  if(r.kaishu) return {tone:'overdue', main:`車両を回収済みです。残っているお支払いは ${yen(r.debt)}円。`,
    sub:'この方には督促をしません。残債の扱いは決まっていません。'};
  if(r.paid) return {tone:'ok', main:`今回の分（${money}）は入金を確認しています。`,
    sub:`次は ${jpDate(r.due)}ごろ。${o.n ? `過去に未収が ${o.n}回 あります。` : 'これまで遅れはありません。'}`};
  if(st === 'overdue') return {tone:'overdue',
    main:`${daysLate(r.due)}日 遅れています。${jpDate(r.due)}が期日の ${money} が未入金です。`,
    sub:`${o.n ? `未収は通算 ${o.n}回（${yen(o.yen)}円）。` : ''}${pr ? `${jpDate(pr.day)}に支払う約束があります。` : ''}${r.note || ''}`};
  if(st === 'today') return {tone:'today', main:`今日が期日です。${money} をお預かりします。`,
    sub:`受け取り方は ${r.method}。${r.note || ''}`};
  if(st === 'hold') return {tone:'today',
    main:`${pr ? jpDate(pr.day) : '後日'} に支払う約束です。${money}。`,
    sub:`${pr && pr.memo ? pr.memo : ''}${o.n ? ` 未収は通算 ${o.n}回。` : ''}`};
  return {tone:'ok', main:`遅れはありません。次は ${jpDate(r.due)}、${money} です。`,
    sub:`${o.n ? `過去に未収が ${o.n}回 あります。` : 'これまで遅れたことはありません。'}${r.note || ''}`};
}

const TERM = 48;                 // 基本の支払い回数(48回=4年)
const termOf = r => r.term || TERM;
let openNo = null;               // 開いている回次

// 回次kの支払期日
function dueOfNo(r, k){
  const st = MONTHS[r.si] || MONTHS[0];
  const t = st.y * 12 + (st.m - 1) + (k - 1);
  return {y: Math.floor(t / 12), m: t % 12 + 1, d: +r.due.slice(3)};
}
// 回次kのようす
function stateOfNo(r, k){
  const mi = r.si + (k - 1);
  if(mi >= MONTHS.length) return 'pending';
  return cellState(r, mi);
}
const ST_LABEL = {paid:'入金', late:'遅れて入金', unpaid:'未収', part:'金額ちがい',
                  due:'期日', pending:'これから', none:'—'};

// 回次を指定して記録を足す(追記のみ)
function logAt(r, no, kind, text, memo){
  EVENTS.push({cid:r.id, no, when:stamp(), who:'管理者', kind, text, memo:memo || ''});
}

function openCard(id){ cardId = id; openNo = null; go('card'); }

// 全42回をツリーで。回を開くと、その回のやり取りとメモ欄が出る。
function termRows(r){
  const past = pastEvents(r);
  const out = [];
  for(let k = 1; k <= termOf(r); k++){
    const st = stateOfNo(r, k), d = dueOfNo(r, k);
    const ev = past.concat(EVENTS.filter(e => e.cid === r.id)).filter(e => e.no === k);
    const memoCount = ev.filter(e => e.kind === 'メモ' || e.memo).length;
    const open = openNo === k;
    const last = ev.length ? ev[ev.length-1] : null;
    out.push(`<button class="term-r ${open?'on':''}" data-term="${r.id}:${k}">
      <span class="no">${k}回</span>
      <span class="dt">${d.m}/${pad(d.d)}</span>
      <span class="am">${yen(r.amount)}</span>
      <span class="st-tag t-${st}">${ST_LABEL[st]||'—'}</span>
      <span class="sub">${last ? (last.memo || last.text) : ''}${memoCount ? `　<span class="cv">メモ${memoCount}</span>` : ''}</span>
      <span class="cv">${open?'▼':'▶'}</span>
    </button>`);
    if(open){
      out.push(`<div class="term-p">
        ${ev.length ? ev.map(e => `<div class="term-e">
            <span class="when">${e.when}</span>
            <span><span class="kind ${KIND_CLASS[e.kind]||'k-plain'}">${e.kind}</span>${e.text}
              ${e.memo ? `<span class="log-memo">${e.memo}</span>` : ''}</span>
            <span class="who">${e.who}</span></div>`).join('')
          : '<div class="term-e"><span class="when"></span><span>まだ記録はありません。</span><span class="who"></span></div>'}
        <div class="term-add">
          <input id="termMemo" autocomplete="off" placeholder="この回のメモ（電話の内容、いくら入ったか、約束など）">
          <button class="btn-pay" data-termadd="${r.id}:${k}">メモを残す</button>
        </div>
      </div>`);
    }
  }
  return out.join('');
}

          ${o.n ? `<tr><td class="k">未収</td><td class="v d-short">${o.n}回 ／ ${yen(o.yen)}円</td></tr>` : ''}
          ${r.diff ? `<tr><td class="k">過不足</td><td class="v ${r.diff<0?'d-short':'d-over'}">${r.diff<0?'不足':'余り'} ${yen(Math.abs(r.diff))}円</td></tr>` : ''}
          ${r.bonus > 10 ? `<tr><td class="k">ボーナス見込み</td><td class="v b-exp">残り ${yen(r.bonus)}円（毎月額の${bonusRatio(r).toFixed(1)}回分）</td></tr>` : ''}
        </table>
      </div>

      <div class="card-sec">
        <h4>支払いのようす</h4>
        <div class="card-rec">
          <span>払った <b>${c.paid}</b>/${c.months}回</span>
          <span class="${c.late?'rec-late':''}">遅れ <b>${c.late}</b></span>
          <span class="${c.unpaid?'rec-unpaid':''}">未収 <b>${c.unpaid}</b></span>
          <span class="${c.maxRun>1?'rec-unpaid':''}">連続で滞った <b>${c.maxRun}</b>ヶ月</span>
          <span class="${c.part?'rec-part':''}">金額ちがい <b>${c.part}</b></span>
          <span class="${c.broken?'rec-unpaid':''}">約束を破った <b>${c.broken}</b></span>
        </div>
        <div class="card-do">
          ${r.paid ? '<span class="hint">今回の分は入金ありとして記録済みです。</span>'
                   : `<button class="btn-pay" data-cardpay="${r.id}">入金を記録する</button>`}
          ${!r.paid && !r.kaishu ? `<button class="btn btn-weak" data-promise="${r.id}">後日の約束</button>` : ''}
        </div>
      </div>

      <div class="memo-box card-sec">
        <h4>この方についてのメモ</h4>
        <textarea id="custMemo" rows="4" placeholder="連絡のつきやすい時間、勤務先、家族のこと、事情など">${r.memo || ''}</textarea>
        <div class="memo-save">
          <button class="btn" data-custmemo="${r.id}">メモを保存</button>
          <span class="nc-hint">この欄は書き直せます。</span>
        </div>
      </div>
     </div>

     <div class="card-right card-sec">
       <h4>支払いの記録（全${termOf(r)}回）　回を押すと、その回のやり取りとメモが出ます</h4>
       <div class="terms">${termRows(r)}</div>
     </div>
    </div>
  </div>`;
}

function render(){ renderTabs(); renderTotals(); renderRows(); renderUnmatched();
                   renderDash(); renderPend(); renderSummary(); renderCard(); }

function go(view){
  document.getElementById('viewDash').hidden = (view !== 'dash');
  document.getElementById('viewCard').hidden = (view !== 'card');
  document.getElementById('viewPend').hidden = (view !== 'pend');
  document.querySelectorAll('.vn[data-view]').forEach(b =>
    b.classList.toggle('on', b.dataset.view === view));
  window.scrollTo(0, 0);
  render();
}

function showUndo(text, undoFn){
  history.push(undoFn);
  document.getElementById('undoText').textContent = text;
  document.getElementById('undoBar').classList.add('show');
  document.getElementById('btnUndoTop').disabled = false;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => document.getElementById('undoBar').classList.remove('show'), 9000);
}

function doUndo(){
  const fn = history.pop();
  if(fn) fn();
  document.getElementById('undoBar').classList.remove('show');
  document.getElementById('btnUndoTop').disabled = history.length===0;
  render();
}

function pay(id, silent){
  const r = state.find(x => x.id===id);
  if(!r || r.paid) return;
  r.paid = true; r.paidWith = r.method; r.hold = false;
  openId = null;
  render();
  if(!silent) showUndo(`${r.name}さん ${yen(r.amount)}円 を入金ありにしました`, () => { r.paid=false; r.paidWith=null; });
}

document.addEventListener('click', e => {
  const t = e.target;

  const hb = t.closest('[data-hist]');
  if(hb){ openHist(+hb.dataset.hist); return; }
  if(t.closest('[data-histclose]')){ closeHist(); return; }

  const pl = t.closest('[data-plan]');
  if(pl){
    const r = state.find(x => x.id === +pl.dataset.pid), before = r.plan;
    const memo = takeMemo();
    r.plan = pl.dataset.plan; render();
    logEvent(r, 'メモ', `差額の扱いを「${PLAN[r.plan]}」に決めた`, memo);
    showUndo(`${r.name}さん の差額を「${PLAN[r.plan]}」で処理すると決めました`, () => { r.plan = before; });
    return;
  }
  const pc = t.closest('[data-planclear]');
  if(pc){ const r = state.find(x => x.id === +pc.dataset.planclear);
    const before = r.plan; r.plan = null; render();
    showUndo(`${r.name}さん の差額の扱いを取り消しました`, () => { r.plan = before; }); return; }

  const ch = t.closest('[data-choice]');
  if(ch){ payChoice = ch.dataset.choice; render(); if(payChoice==='other') focusOther(); return; }
  const dm = t.closest('[data-dmode]');
  if(dm){ diffMode = dm.dataset.dmode; render(); focusOther(); return; }
  if(t.closest('[data-planopen]')){ planOpen = !planOpen; render(); return; }

  const cm = t.closest('[data-commit]');
  if(cm){
    const r = state.find(x => x.id === +cm.dataset.commit), memo = takeMemo();
    const before = r.diff;
    if(payChoice === 'other'){
      const v = +(document.getElementById('otherInput').value || '').replace(/[^0-9]/g,'');
      if(!v){ alert('入った金額を入れてください。'); return; }
      const d = v - r.amount, bBefore = r.bonus;
      let tail;
      if(diffMode === 'bonus' && d > 0){
        const use = Math.min(d, r.bonus);
        r.bonus -= use; r.bonusPaid++;
        r.diff = before + (d - use);
        tail = `${yen(use)}円 をボーナス分に充てました（見込みの残り ${yen(r.bonus)}円）`;
      } else {
        r.diff = diffMode === 'carry' ? before + d : 0;
        tail = diffMode === 'settle' ? '差額を精算しました'
          : (r.diff === 0 ? '過不足はなくなりました'
             : `過不足は ${r.diff<0?'不足':'余り'} ${yen(Math.abs(r.diff))}円 になりました`);
      }
      pay(r.id, true);
      logEvent(r, diffMode === 'bonus' ? 'ボーナス' : '差額',
        `${yen(v)}円 を受け取り（請求 ${yen(r.amount)}円）。${tail}`, memo);
      showUndo(`${r.name}さん ${yen(v)}円 を記録。${tail}`,
        () => { r.paid=false; r.paidWith=null; r.diff=before;
                if(r.bonus !== bBefore){ r.bonus = bBefore; r.bonusPaid--; } });
    } else if(payChoice === 'need'){
      const v = r.amount - before;
      r.diff = 0; pay(r.id, true);
      logEvent(r, '入金', `${yen(v)}円 を受け取り、過不足を0にした`, memo);
      showUndo(`${r.name}さん ${yen(v)}円 を記録し、過不足を0にしました`,
        () => { r.paid=false; r.paidWith=null; r.diff=before; });
    } else {
      pay(r.id, true);
      logEvent(r, '入金', `${yen(r.amount)}円 を受け取ったとして記録`, memo);
      showUndo(`${r.name}さん ${yen(r.amount)}円 を入金ありにしました`,
        () => { r.paid=false; r.paidWith=null; });
    }
    return;
  }

  const impBtn = t.closest('[data-imp]');
  if(impBtn){
    const a = impBtn.dataset.imp;
    if(a === 'close'){ closeImport(); return; }
    if(a === 'sample'){
      try { startCheck(ingestZengin(buildSampleCsv()), true); }
      catch(err){ imp.error = 'サンプルの生成に失敗：' + err.message; renderImport(); }
      return;
    }
    if(a === 'commit'){
      const ids = [];
      BANK.filter(b => b.auto).forEach(b => {
        const r = state.find(x => x.id === b.target);
        if(r && !r.paid){ r.paid = true; r.paidWith = '振込'; r.hold = false; ids.push(r.id); }
      });
      unmatched = BANK.filter(b => !b.auto).map(b => ({...b}));
      imported = true;
      closeImport();
      render();
      showUndo(`明細から ${ids.length}件を消し込みました(残り${unmatched.length}件は本人の確認待ち)`,
        () => { ids.forEach(id => { const r = state.find(x => x.id===id); r.paid = false; r.paidWith = null; });
                unmatched = []; imported = false; });
      return;
    }
    return;
  }

  const po = t.closest('[data-pendopen]');
  if(po){ const k = po.dataset.pendopen; pendOpen = (pendOpen === k ? null : k); renderPend(); return; }

  const cd = t.closest('[data-cashdone]');
  if(cd){ const i = +cd.dataset.cashdone, c = CASH[i], memo = takeMemo();
    c.done = true; pendOpen = null; renderPend();
    showUndo(`${c.name}さん からの ${yen(c.amount)}円（${c.receipt}）を、銀行へ入れたことにしました`,
      () => { c.done = false; });
    return; }

  const pm = t.closest('[data-pmemo]');
  if(pm){ const r = state.find(x => x.id === +pm.dataset.pmemo), memo = takeMemo();
    if(!memo){ alert('メモを書いてください。'); return; }
    logEvent(r, 'メモ', '懸案として確認', memo);
    pendOpen = null; renderPend();
    showUndo(`${r.name}さん の記録にメモを残しました`, () => {});
    return; }

  // お名前を押したら、その人の全部を1画面で出す
  const cardBtn = t.closest('[data-card]');
  if(cardBtn){
    openCard(+cardBtn.dataset.card);
    return;
  }
  // カードから一覧へ戻る
  if(t.closest('#backList')){ cardId = null; openNo = null; render(); window.scrollTo(0,0); return; }

  // 回を開く / 閉じる
  const termBtn = t.closest('[data-term]');
  if(termBtn){
    const k = +termBtn.dataset.term.split(':')[1];
    openNo = (openNo === k ? null : k);
    renderCard();
    return;
  }
  // その回にメモを足す(追記のみ)
  const termAdd = t.closest('[data-termadd]');
  if(termAdd){
    const [id, k] = termAdd.dataset.termadd.split(':').map(Number);
    const r = state.find(x => x.id === id);
    const el = document.getElementById('termMemo');
    const v = (el && el.value || '').trim();
    if(!v){ alert('メモを入れてください。'); return; }
    logAt(r, k, 'メモ', v, '');
    renderCard();
    showUndo(`${r.name}さん ${k}回目 にメモを残しました`, () => { EVENTS.pop(); renderCard(); });
    return;
  }
  // この方についてのメモ(書き直せる欄)
  const cmemo = t.closest('[data-custmemo]');
  if(cmemo){
    const r = state.find(x => x.id === +cmemo.dataset.custmemo);
    const el = document.getElementById('custMemo');
    const before = r.memo || '';
    r.memo = (el && el.value || '').trim();
    logAt(r, r.no, 'メモ', 'この方についてのメモを更新した', '');
    renderCard();
    showUndo(`${r.name}さん のメモを保存しました`, () => { r.memo = before; EVENTS.pop(); renderCard(); });
    return;
  }

  // よみ(カナ)を登録する
  const yomiBtn = t.closest('[data-yomi]');
  if(yomiBtn){
    const r = state.find(x => x.id === +yomiBtn.dataset.yomi);
    const el = document.getElementById('yomiInput');
    const v = (el && el.value || '').trim();
    if(!v){ alert('よみ（カナ）を入れてください。'); return; }
    const before = r.kana;
    r.kana = v;
    logEvent(r, 'メモ', `よみを「${v}」として登録した`, '');
    render();
    showUndo(`${r.name}さん のよみを登録しました`, () => { r.kana = before; EVENTS.pop(); });
    return;

  // カードから入金の記録へ(台帳のその人を開く)
  const cardpay = t.closest('[data-cardpay]');

  const vnav = t.closest('.vn[data-view]');

    go(vnav.dataset.view);

  const work = t.closest('[data-go]');
  if(work){

    if(key === 'cash'){ alert('銀行へ入れる手続きの画面(モックでは省略)'); return; }

    if(key === 'unmatched'){

  const tab = t.closest('.tab');

  const seg = t.closest('.seg button');

  // 新しいお客さんの追加
  if(t.closest('[data-ncadd]')){ addCustomer(); return; }
  if(t.closest('[data-ncclose]')){ closeNewCustomer(); return; }

  const assign = t.closest('[data-assign]');
  if(assign){
    const u = unmatched.find(x => x.uid === assign.dataset.assign);
    const r = state.find(x => x.id === u.target);
    unmatched = unmatched.filter(x => x.uid !== u.uid);
    const d = u.amount - r.amount, bBefore = r.bonus, dBefore = r.diff;
    if(d > 0 && r.bonus > 10){ const use = Math.min(d, r.bonus); r.bonus -= use; r.bonusPaid++; r.diff += (d - use); }
    else if(d !== 0){ r.diff += d; }
    r.paid = true; r.paidWith = '振込'; r.hold = false;
    logEvent(r, (d > 0 && bBefore > 10) ? 'ボーナス' : '入金', `${u.payer} からの ${yen(u.amount)}円 を割り当て`, '');
    render();
    showUndo(`${u.payer} を ${r.name}さん の入金にしました`, () => {
      r.paid=false; r.paidWith=null; r.bonus=bBefore; r.diff=dBefore; unmatched.push(u);
      unmatched.sort((a,b) => a.uid.localeCompare(b.uid));

  }

  if(t.closest('[data-search]')){ alert('名簿から探す画面(モックでは省略)'); return; }

  const row = t.closest('.lrow');
  if(row){
    const id = +row.dataset.row;
    const r = state.find(x => x.id===id);
    if(r.paid){
      r.paid=false; r.paidWith=null; render();
      showUndo(`${r.name}さん の入金を取り消しました`, () => { r.paid=true; r.paidWith=r.method; });

    openId = (openId===id ? null : id);

    render();

  }

  if(t.closest('#umBar') && unmatched.length){
    const list = document.getElementById('umList');
    list.classList.toggle('open');
    document.getElementById('umCaret').textContent = list.classList.contains('open') ? '▼' : '▶';
  }
});

// ─── 銀行CSV取込(全銀協規定形式 入出金明細・種別03)──────────────
// CSV(カンマ区切・可変長)と固定長(200バイト)の両方に対応。
// 文字コードはShift-JIS、日付は和暦YYMMDD、振込依頼人名は半角カナ。
// 入金(入払区分=1)だけを取り出し、名寄せで契約に当てる。
// 参考:SMBC/関西みらい銀行ほか公開の全銀協規定形式レコードフォーマット。

// 名寄せの正規化:半角/全角カナを統一(NFKC)、法人格・記号・空白を除く
function normKana(s){
  return (s || '').normalize('NFKC')
    .replace(/[\s　]/g, '')
    .replace(/株式会社|有限会社|（株）|\(株\)|（有）|\(有\)|カブシキガイシャ/g, '')
    .replace(/^カ\)|（カ$|\(カ$|カ\)$/g, '')
    .replace(/[()（）.,･・ｰー-]/g, '')
    .toUpperCase();
}

// 名寄せ辞書:一度人が紐付けた対応(SEED)を正規化キーで引く
const ALIAS = {};
SEED.forEach(s => {
  const k = normKana(s.payer);
  (ALIAS[k] = ALIAS[k] || []).push({target: s.target, auto: s.auto, why: s.why, amount: s.amount});
});

// 和暦YYMMDD → {y,m,d,md}。令和固定(令和N年 = 2018+N)。
function warekiToDate(yymmdd){
  const s = String(yymmdd).padStart(6, '0');
  const yy = +s.slice(0,2), mm = +s.slice(2,4), dd = +s.slice(4,6);
  return {y: 2018 + yy, m: mm, d: dd, md: `${pad(mm)}-${pad(dd)}`};
}

// CSV1行 → フィールド配列(前後スペース・引用符を除去。全銀CSVは前後スペースを削る運用)
function csvFields(line){
  return line.split(',').map(f => f.trim().replace(/^"(.*)"$/, '$1').trim());
}

// 全銀ファイル(テキスト)を解析 → {deposits, trailer, header}
function parseZengin(text){
  const lines = text.replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim().length);
  if(!lines.length) throw new Error('中身が空です。');
  const isCsv = lines.some(l => l.includes(','));
  const deposits = []; let trailer = null, header = null, dataSeen = 0;

  for(const line of lines){
    let kubun, f;
    if(isCsv){ f = csvFields(line); kubun = f[0]; }
    else { f = line; kubun = line.slice(0,1); }

    if(kubun === '1'){                       // ヘッダー(区分1)
      header = isCsv ? {bank: f[7], branch: f[9], account: f[12]}
                     : {bank: (f.slice(21,36) || '').trim()};
    } else if(kubun === '2'){                // データ(区分2)
      dataSeen++;
      let nyubarai, amount, kanjoubi, payer, torihiki;
      if(isCsv){
        kanjoubi = f[2]; nyubarai = f[4]; torihiki = f[5];
        amount = +String(f[6]).replace(/[^0-9]/g, ''); payer = f[14] || '';
      } else {                               // 固定長:データレコードは全て半角=1バイト
        kanjoubi = f.slice(9,15); nyubarai = f.slice(21,22); torihiki = f.slice(22,24);
        amount = +f.slice(24,36).replace(/[^0-9]/g, ''); payer = (f.slice(81,129) || '').trim();
      }
      if(nyubarai !== '1') continue;         // 入金だけ。出金(2)は無視
      if(torihiki === '19') continue;        // 訂正は取込対象外(取消として別扱い)
      const d = warekiToDate(kanjoubi);
      deposits.push({date: d, md: d.md, amount, payer, kubun: torihiki});
    } else if(kubun === '8'){                // トレーラ(区分8)
      trailer = isCsv
        ? {inCount: +f[1], inTotal: +String(f[2]).replace(/[^0-9]/g, '')}
        : {inCount: +f.slice(1,7), inTotal: +f.slice(7,20).replace(/[^0-9]/g, '')};
    }
  }
  if(!dataSeen) throw new Error('全銀協規定形式のデータレコード(区分2)が見つかりません。');
  return {deposits, trailer, header};
}

// 名寄せ:振込依頼人名(と金額)から契約を当てる
function resolveDeposit(dep){
  const cand = ALIAS[normKana(dep.payer)] || [];
  if(cand.length === 1) return {target: cand[0].target, auto: cand[0].auto, why: cand[0].why};
  if(cand.length > 1){
    let best = cand[0];
    cand.forEach(c => { if(Math.abs((c.amount||0) - dep.amount) < Math.abs((best.amount||0) - dep.amount)) best = c; });
    return {target: best.target, auto: false, why: '同じ名義が複数。金額で判断'};
  }
  return {target: null, auto: false, why: ''};
}

// 解析結果を取込フローが使う BANK 形へ
function depositsToBank(deposits){
  return deposits.map((dep, i) => {
    const m = resolveDeposit(dep);
    return {uid: 'z' + (i+1), date: dep.md, amount: dep.amount, payer: dep.payer,
            target: m.target, why: m.why, auto: m.auto && m.target != null};
  });
}

// 練習用サンプル:SEED から全銀協規定形式CSVをその場で生成(和暦・区分つき)
function buildSampleCsv(){
  const yy = pad(NOW.getFullYear() - 2018);       // 令和年
  const rows = [];
  rows.push(['1','03','0', yy+'0724', yy+'0701', yy+'0731','1234','ﾁｸﾎｷﾞﾝｺｳ',
             '001','ﾎﾝﾃﾝ','000','1','1234567','ｼﾞﾄﾞｳｼｬﾊﾝﾊﾞｲ','','','',''].join(','));
  let cnt = 0, total = 0;
  SEED.forEach(s => {
    const [mm, dd] = s.date.split('-');
    const rec = new Array(20).fill('');
    rec[0]='2'; rec[2]=yy+mm+dd; rec[3]=yy+mm+dd; rec[4]='1'; rec[5]='11';
    rec[6]=String(s.amount); rec[14]=s.payer;
    rows.push(rec.join(','));
    cnt++; total += s.amount;
  });
  rows.push(['8', String(cnt), String(total), '0', '0', '1', '0', String(cnt)].join(','));
  rows.push(['9', String(cnt+2), '1'].join(','));
  return rows.join('\r\n') + '\r\n';
}

// 解析 → 名寄せ → BANK へ。件数の要約とファイル検算(トレーラ照合)を返す
function ingestZengin(text){
  const {deposits, trailer} = parseZengin(text);
  BANK = depositsToBank(deposits);
  const sum = BANK.reduce((a,b) => a + b.amount, 0);
  return {
    count: BANK.length,
    auto: BANK.filter(b => b.auto).length,
    manual: BANK.filter(b => !b.auto).length,
    sum,
    trailerTotal: trailer ? trailer.inTotal : null,
    checksumOK: trailer ? trailer.inTotal === sum : null,
  };
}

// 解析後、通帳照合(ADR-006)のステップへ
function startCheck(summary, isSample){
  summary.isSample = !!isSample;
  imp.summary = summary; imp.error = null; imp.mode = 'confirm';
  renderImport();
}

      <div class="imp-input-row">
        <input type="file" id="zenginFile" accept=".csv,.txt,text/csv,text/plain">
      </div>
      <p class="imp-note">文字コードShift-JIS・日付は和暦・名義は半角カナのファイルに対応します。<br>
        入金だけを取り出し、お名前で本人を照合します。ファイルはこの端末の中だけで処理します。</p>
      ${imp.error ? `<div class="imp-verdict imp-bad">${imp.error}</div>` : ''}
      <div class="imp-actions">
        <button class="btn" data-imp="sample">練習用サンプルで試す</button>

    fi.addEventListener('change', () => {
      const file = fi.files[0]; if(!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const text = new TextDecoder('shift_jis').decode(new Uint8Array(rd.result));
          startCheck(ingestZengin(text), false);
        } catch(e){ imp.error = '読み取れませんでした：' + e.message; imp.mode = 'choose'; renderImport(); }
      };
      rd.onerror = () => { imp.error = 'ファイルを読めませんでした。'; renderImport(); };
      rd.readAsArrayBuffer(file);
    });
    return;
  }

  if(imp.mode === 'confirm'){
    // CSV取込に一本化したので、人が通帳合計を手入力する照合(ADR-006の暫定)は廃止。
    // ファイル内の検算(トレーラの入金合計=明細合計)を自動で行い、崩れたときだけ知らせる。
    const bad = imp.summary && imp.summary.checksumOK === false;
    box.innerHTML = `
      <div class="imp-line"><span>取り込む入金</span><b>${BANK.length}件</b></div>
      <div class="imp-line"><span>お名前が一致した</span><b>${auto.length}件</b></div>
      <div class="imp-line"><span>本人を確かめる必要がある</span><b>${manual.length}件</b></div>
      ${bad ? `<div class="imp-verdict imp-bad">ファイルの合計(トレーラ)と明細の合計が一致しません。一部しか取れていないか、ファイルが壊れている可能性があります。</div>` : ''}
      <p class="imp-note">お名前が一致した分はそのまま取り込み、確かめる必要がある分は「誰の入金か分からないもの」に残します。</p>
      <div class="imp-actions">
        <button class="btn-pay" data-imp="commit">${bad ? 'それでも取り込む' : '取り込む'}</button>
        <button class="btn" data-imp="close">やめる</button>
      </div>`;
    return;
  }
}

// ─── 新しいお客さん(契約)の追加 ───────────────────────
function ncDigits(id){ const el = document.getElementById(id); return el ? +el.value.replace(/[^0-9]/g,'') : 0; }
function ncMonths(id){ const el = document.getElementById(id); return el ? (el.value.match(/\d+/g)||[]).map(Number).filter(m => m>=1 && m<=12) : []; }
function ncFirstMonth(){ return new Date(NOW.getFullYear(), NOW.getMonth()+1, 1); } // 原則、納車の翌月

function openNewCustomer(){ document.getElementById('newModal').hidden = false; renderNewCustomer(); }
function closeNewCustomer(){ document.getElementById('newModal').hidden = true; }

function renderNewCustomer(){
  document.getElementById('newBody').innerHTML = `
    <div class="cmp-line"><span class="cmp-k">お名前</span><input class="cmp-input" id="ncName" autocomplete="off"></div>
    <div class="cmp-line"><span class="cmp-k">よみ</span><input class="cmp-input" id="ncKana" autocomplete="off" placeholder="カナ（あいうえお順に並べるため）"></div>

    <div class="cmp-line"><span class="cmp-k">支払日</span><input class="cmp-input nc-day" id="ncDay" inputmode="numeric" autocomplete="off" value="27"><span class="nc-unit">日（原則27）</span></div>

    <div class="cmp-line"><span class="cmp-k">ボーナス月</span><input class="cmp-input" id="ncBonusMonths" autocomplete="off" placeholder="例: 8,12（任意）"></div>
    <div class="cmp-line"><span class="cmp-k">ボーナス額</span><input class="cmp-input nc-num" id="ncBonusEach" inputmode="numeric" autocomplete="off" placeholder="1回あたり（任意）"><span class="nc-unit">円</span></div>
    <div class="cmp-line"><span class="cmp-k">連絡先</span><input class="cmp-input" id="ncContact" autocomplete="off" placeholder="電話/メール（任意）"></div>
    <div class="nc-preview" id="ncPreview"></div>
    <p class="imp-note">支払いは全48回、支払日は原則27日(変更できます)。手数料は支払総額の25%で自動計算します。連絡先は権限を分けて扱う項目です。</p>
    <div class="imp-actions">
      <button class="btn-pay" data-ncadd="1">登録する</button>
      <button class="btn" data-ncclose="1">やめる</button>
    </div>`;
  ['ncMonthly','ncPrice','ncBonusEach'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => { const n = el.value.replace(/[^0-9]/g,''); el.value = n ? Number(n).toLocaleString('ja-JP') : ''; ncPreview(); });
  });
  ['ncDay','ncBonusMonths'].forEach(id => document.getElementById(id).addEventListener('input', ncPreview));
  document.getElementById('ncName').focus();
  ncPreview();
}

function ncPreview(){
  const box = document.getElementById('ncPreview'); if(!box) return;
  const day = Math.min(Math.max(ncDigits('ncDay')||27, 1), 31);
  const nm = ncFirstMonth();
  const first = document.getElementById('ncFirst');
  if(first) first.textContent = `${nm.getFullYear()}年${nm.getMonth()+1}月${day}日から`;
  const amount = ncDigits('ncMonthly');
  if(!amount){ box.innerHTML = '<span class="nc-hint">毎月の額を入れると、内訳と支払総額が出ます。</span>'; return; }
  const moto = Math.round(amount*0.75), fee = amount - moto;
  const bm = ncMonths('ncBonusMonths'), be = ncDigits('ncBonusEach');
  const bonusTotal = be * bm.length * 4;                    // 1回あたり × 年の回数 × 4年(48回)
  const total = amount*48 + bonusTotal, feeTotal = Math.round(total*0.25), motoTotal = total - feeTotal;
  const price = ncDigits('ncPrice');
  let rec = '';
  if(price){ const df = price - motoTotal; rec = Math.abs(df) <= 100
    ? '<div class="nc-ok">車の代金と、計算した元本が一致しています ✓</div>'
    : `<div class="nc-warn">車の代金 ${yen(price)}円 と、毎月額から計算した元本 ${yen(motoTotal)}円 が ${yen(Math.abs(df))}円 ちがいます。ご確認ください。</div>`; }
  box.innerHTML = `
    <div class="nc-line">毎月 <b>${yen(amount)}円</b>（元本 ${yen(moto)} + 手数料 ${yen(fee)}）</div>
    <div class="nc-line">全48回の支払総額 <b>${yen(total)}円</b>（うち手数料25% ${yen(feeTotal)}円）</div>
    ${bonusTotal ? `<div class="nc-line">ボーナス見込み ${yen(bonusTotal)}円（${bm.join('・')}月 × ${yen(be)}円 × 4年）</div>` : ''}
    ${rec}`;
}

function addCustomer(){
  const name = (document.getElementById('ncName').value||'').trim();
  const car  = (document.getElementById('ncCar').value||'').trim();
  const amount = ncDigits('ncMonthly');
  if(!name){ alert('お名前を入れてください。'); return; }
  if(!amount){ alert('毎月の額を入れてください。'); return; }
  const day = Math.min(Math.max(ncDigits('ncDay')||27, 1), 31);
  const bm = ncMonths('ncBonusMonths'), be = ncDigits('ncBonusEach');
  const bonusTotal = be * bm.length * 4;
  const moto = Math.round(amount*0.75), fee = amount - moto;
  const nm = ncFirstMonth(), fy = nm.getFullYear(), fm = nm.getMonth()+1;
  const due = `${pad(fm)}-${pad(day)}`;
  let si = MONTHS.findIndex(mo => mo.y===fy && mo.m===fm); if(si < 0) si = MONTHS.length;
  const id = Math.max(0, ...state.map(r => r.id)) + 1;
  const row = { id, due, name,
    ct: `${car || '車両未記入'}（${NOW.getMonth()+1}月契約）`,
    dt: `元本 ${yen(moto)} / 手数料 ${yen(fee)}`, amount, method: '振込', note: '',
    parts: [['元本相当', moto], ['手数料相当', fee]], n: '1/48',
    paid0: false, paid: false, paidWith: null, kaishu: false, diff: 0,
    no: 1, rest: 47, si, debt: amount*48 + bonusTotal, bonus: bonusTotal, bonusPaid: 0,
    kana: (document.getElementById('ncKana').value||'').trim(),
    contact: (document.getElementById('ncContact').value||'').trim() };
  HIST[id] = MONTHS.map((_, i) => i < si ? 'none' : 'pending');
  state.push(row);
  logEvent(row, 'メモ', `新しいお客さん（${name}／${car || '車両未記入'}）を登録した`, '');
  closeNewCustomer();
  filter = 'up'; openId = id; cardId = null; resetPanel(row); go('card');
  showUndo(`${name}さん を新しく登録しました`, () => {
    const i = state.findIndex(x => x.id === id); if(i >= 0) state.splice(i, 1);
    delete HIST[id]; EVENTS.pop(); openId = null;
  });
}
